<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/bootstrap.min.css" rel="stylesheet" media="screen">
    <link href="css/material-icons.css" rel="stylesheet" media="screen">
    <link href="css/animate.css" rel="stylesheet" media="screen">
    <link href="css/store.css" rel="stylesheet" media="screen">
</head>

<body class="backdrop-simple fade fade-1s">
    <div id="wrapper">
        <div id="title-inject"></div>
        <div id="content" class="pl-5 pr-5 pt-4 entire-page-fade">
            <div class="row">
                <div class="col-md-1"></div>
                <div class="col-md-10 text-md-center">
                    <div class="row">
                        <div class="col-md-12">
                            <img src="img/store/ic_warning.svg" class="mt-5" style="width:30%" />
                        </div>
                        <div class="col-md-12 mt-3">
                            <h2><strong id="title_warning"></strong></h2>
                        </div>
                        <div class="col-md-12 mt-3">
                            <h4 id="description_warning"></h4>
                        </div>
                        <div class="col-md-6 mt-4">
                            <button id="btn_back_waning" class="btn btn-danger btn-lg w-75 ml-2">
                                <span class="button-text">Cancelar</span>
                            </button>
                        </div>
                        <div class="col-md-6 mt-4">
                            <button id="btn_next_waning" class="btn btn-secondary btn-lg w-75 mr-2">
                                <span class="button-text">Continuar</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-1"></div>
            </div>
        </div>
    </div>
    <script src="js/jquery-2.1.4.js"></script>
    <script src="js/tether.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/janimate.js"></script>
    <script src="js/confetti.js"></script> <!-- Confetti only appears on special events -->
    <script src="js/wow.js"></script>
    <script src="js/store.js"></script>
    <script src="js/warning.js"></script>
</body>

</html>
