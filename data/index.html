<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/bootstrap.min.css" rel="stylesheet" media="screen">
    <link href="css/material-icons.css" rel="stylesheet" media="screen">
    <link href="css/animate.css" rel="stylesheet" media="screen">
    <link href="css/store.css" rel="stylesheet" media="screen">
    <link href="css/fingerprint.css" rel="stylesheet" media="screen">

</head>

<body class="backdrop-simple fade fade-1s">
    <div id="wrapper">
        <div id="title-inject"></div>
        <button id="theme-toggle" style="display:none;">Toggle Theme</button>
        <div id="content" class="pl-5 pr-5 pt-4 entire-page-fade">
            <div class="row">
                <div class="col-md-1 text-md-center mb-3"></div>
                <div class="col-md-10 text-md-center mt-3 mb-3">
                    <div class="card rounded shadow bg-light">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-1"></div>
                                <div class="col-md-2 text-md-center">
                                    <img id="img_app" class="rounded w-100">
                                </div>
                                <div class="col-md-4 d-flex align-items-center text-md-left">
                                    <div class="row ml-4 mr-4">
                                        <div class="col-md-12">
                                            <h2 id="lbl_name_app"><strong></strong></h2>
                                        </div>
                                        <div class="col-md-12">
                                            <p id="lbl_author_app"></p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-5 d-flex align-items-center text-md-center">
                                    <div class="row">
                                        <div class="col-md-12 d-flex align-items-center text-md-center">
                                            <button id="btn_install_app" class="btn btn-success btn-lg w-100 d-none">
                                                <span class="material-icons">&#xE2C0;</span><span class="button-text"
                                                    data-lang-en="Install" data-lang-pt="Instalar"></span>
                                            </button>
                                        </div>
                                        <div class="col-md-12">
                                            <div class="row">
                                                <div class="col-md-12">
                                                    <button id="btn_open_app"
                                                        class="btn btn-primary btn-lg w-100 d-none">
                                                        <span class="material-icons">open_in_new</span><span
                                                            class="button-text" data-lang-en="Open"
                                                            data-lang-pt="Abrir"></span>
                                                    </button>
                                                </div>
                                                <div class="col-md-12">
                                                    <button id="btn_remove_app"
                                                        class="btn btn-danger btn-lg w-100 d-none">
                                                        <span class="material-icons">&#xE872;</span><span
                                                            class="button-text" data-lang-en="Remove"
                                                            data-lang-pt="Remover"></span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-12 mt-3">
                                            <span id="pgr_install_app" class="w-100 d-none">
                                                <img src="img/store/processing.gif" style="width:24px" />
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-1 text-md-center mb-3"></div>
            </div>
            <div class="row">
                <div class="col-md-1 text-md-center mb-3"></div>
                <div class="col-md-10 text-md-center mt-3 mb-3">
                    <div class="card rounded shadow bg-light">
                        <div class="card-body">
                            <div class="row m-5">
                                <div class="col-md-12 d-flex align-items-center text-md-left">
                                    <h2><strong data-lang-en="What are Codecs for?"
                                            data-lang-pt="Para que servem os Codecs?"> </strong></h2>
                                </div>
                                <div class="col-md-12 d-flex align-items-center text-md-left">
                                    <p id="lbl_description_app" style="font-size: 20px;" data-lang-en="
                                        Codecs are software programs or libraries that enable the encoding (compression) 
                                        and decoding (decompression) of audio and video data streams." data-lang-pt="
                                        Os Codecs são programas ou bibliotecas de software 
                                        que permitem a codificação (compressão) e decodificação (descompressão) 
                                        de fluxos de dados de áudio e vídeo.">
                                    </p>
                                </div>
                                <div class="col-md-12 mt-5 d-flex align-items-center text-md-left">
                                    <h2><strong data-lang-en="How does this affect my experience?"
                                            data-lang-pt="Como isto afeta minha experiência?"></strong></h2>
                                </div>
                                <div class="col-md-12 d-flex align-items-center text-md-left">
                                    <p id="lbl_description_app1" style="font-size: 20px;" data-lang-en="
					                    Codecs are essential components for playing media files on Linux, 
                                        enabling the compression and decompression of audio and video in various formats (MP3, MP4, AAC, H.264, etc.). 
                                        Installing them ensures a complete multimedia experience on the system." data-lang-pt="
                                        Codecs são componentes essenciais para a reprodução de arquivos de mídia no Linux, 
                                        permitindo a compressão e descompressão de áudio e vídeo em diversos formatos (MP3, MP4, AAC, H.264, etc.), 
                                        e a sua instalação garante uma experiência multimídia completa no sistema.">
                                    </p>
                                </div>
                                <!-- TÍTULO (escondido por padrão) -->
                                <div class="col-md-12 mt-5 d-flex align-items-center text-md-left" id="title_fingerprint_app1">
                                    <h2>
                                        <strong data-lang-en="It has been detected that your system has Fingerprint Hardware"
                                                data-lang-pt="Foi detectado que o seu sistema tem um Hardware de Impressão Digital">
                                        </strong>
                                    </h2>
                                </div>

                                <!-- DESCRIÇÃO (escondida por padrão) -->
                                <div class="col-md-12 d-flex align-items-center text-md-left">
                                    <p id="lbl_fingerprint_app1" style="font-size: 20px;" 
                                    data-lang-en="It was detected that your Fingerprint Hardware is a Focal Tech model with vid: 0x2808 and the following ids: 0x9338, 0xd979, 0xc652, 0xa959, 0x0579. 
                                    For it to work, it is necessary to install a model-specific driver provided by the manufacturer.." 
                                    data-lang-pt="O seu Hardware de Impressão digital é do modelo Focal Tech com o vid:0x2808 e um dos seguintes id: 0x9338, 0xd979, 0xc652, 0xa959, 0x0579. 
                                    Para ele funcionar é necessário instalação de um driver específico do modelo fornecido pelo fabricante.">
                                    </p>
                                </div>

                                <!-- BOTÃO -->
                                <div class="col-md-12 mt-3">
                                    <button class="btn btn-primary" onclick="toggleFingerprintApp1()" id="btn_fingerprint_app1" style="display:none"> 
                                        Mostrar detalhes
                                    </button>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-1 text-md-center mb-3"></div>
            </div>
            <div class="row">
                <div class="col-md-1 text-md-center mb-3"></div>
                <div id="section_log" class="col-md-10 text-md-center mt-3 mb-3 d-none">
                    <div class="card rounded shadow bg-light">
                        <div class="card-body">
                            <div id="lbl_log" class="row m-3"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-1 text-md-center mb-3"></div>
            </div>
        </div>
    </div>
    <script src="js/jquery-2.1.4.js"></script>
    <script src="js/tether.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/janimate.js"></script>
    <script src="js/confetti.js"></script> <!-- Confetti only appears on special events -->
    <script src="js/wow.js"></script>
    <script src="js/store.js"></script>
    <script src="js/select-theme.js"></script>
    <script src="js/application.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
